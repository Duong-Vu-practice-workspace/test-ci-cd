services:
  jenkins:
    build:
      context: ..
      dockerfile: Dockerfile.jenkins
      args:
        DOCKER_GID: ${DOCKER_GID:-999}
    image: my-jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    group_add:
      - 964
    ports:
      - "9999:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../:/workspace

volumes:
  jenkins_home:
